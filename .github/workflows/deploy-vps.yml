name: Deploy Website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (skip if frontend not on VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            if [ ! -d /var/www/client-com-to-nhat-ban ]; then
              echo "No client dir on VPS — skip (site may use Vercel)."
              exit 0
            fi
            cd /var/www/client-com-to-nhat-ban
            git pull origin main
            npm ci
            npm run build
            pm2 restart donburi 2>/dev/null || pm2 restart website 2>/dev/null || pm2 restart next 2>/dev/null || true
            pm2 save
            echo "Website deploy done."
